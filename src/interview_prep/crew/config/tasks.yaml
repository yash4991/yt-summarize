short_summary:
  description: >
    You are preparing a candidate for a job interview using the video
    "{title}" by {channel} (length {duration}).

    Below is the transcript. Each line starts with a [mm:ss] or [h:mm:ss]
    marker showing where it is spoken in the video.

    ---------------- TRANSCRIPT START ----------------
    {transcript}
    ---------------- TRANSCRIPT END ------------------

    {revision_notes}

    Write a SHORT summary that someone can read in two minutes right before an
    interview:
    - what_it_is: 2-3 sentences, plain English.
    - key_points: the 5-7 most important ideas. Each must stand on its own.
      Set timestamp_seconds to the second (as an integer) of the transcript
      marker where the idea is explained, e.g. [03:15] -> 195.
    - interview_one_liner: one crisp sentence a candidate could say out loud.
    Use only what the transcript supports.
  expected_output: >
    A ShortSummary object.
  agent: interview_coach

detailed_summary:
  description: >
    Using the same transcript of "{title}", write a DETAILED study guide that
    teaches the topic from the ground up so a candidate can handle deep
    follow-up questions.

    {revision_notes}

    Requirements:
    - overview: 1-2 short paragraphs.
    - sections: 3-8 sections in a logical teaching order. Each has 1-3 short
      paragraphs (separate paragraphs with a blank line) and optional bullets.
      Give bullets a timestamp_seconds from the transcript markers when the
      idea is tied to a specific moment.
    - examples: concrete examples or analogies (from the video where possible).
    - trade_offs and common_mistakes: what interviewers probe for.
    - beyond_the_video: a few important, well-established related points that
      interviewers often ask but the video does not cover. Leave empty if none.
    - quick_recap: 5-8 bullets for last-minute revision.
    Keep paragraphs short and sentences simple.
  expected_output: >
    A DetailedSummary object.
  agent: interview_coach

interview_qa:
  description: >
    Based on the transcript of "{title}" and the summaries you wrote, create
    10-15 interview questions a real interviewer would ask about this topic.

    {revision_notes}

    - Order them from easy to hard and label each easy / medium / hard.
    - model_answer: how a strong candidate would answer, 3-6 sentences,
      first person, confident and precise.
    - follow_up: the follow-up question an interviewer would likely ask next.
    - timestamp_seconds: where in the video the answer is covered, if it is.
    Mix conceptual, practical ("how would you...") and comparison questions.
  expected_output: >
    An InterviewQA object.
  agent: interview_coach

review:
  description: >
    Review the short summary, detailed summary and interview Q&A written for
    the video "{title}" (you have them as context) against its transcript:

    ---------------- TRANSCRIPT START ----------------
    {transcript}
    ---------------- TRANSCRIPT END ------------------

    Check:
    1. Faithfulness: is every claim supported by the transcript, or (only in
       "beyond_the_video") clearly correct general knowledge? Are the
       timestamps plausible?
    2. Coverage: are the important ideas of the video included?
    3. Clarity: is it easy to digest for a candidate?

    Score each from 1 to 10. List concrete issues with a severity ("major" =
    factually wrong or seriously misleading, "minor" = everything else), where
    it is, and how to fix it. Do not invent issues.
  expected_output: >
    A ReviewReport object.
  agent: quality_reviewer
